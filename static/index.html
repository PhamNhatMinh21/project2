<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Định Giá Bất Động Sản</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4F46E5;
            --primary-gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #311042 100%);
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-sub: #64748B;
            --border-color: #E2E8F0;
            --radius-md: 12px;
            --radius-lg: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* Container tổng chia 2 cột ngang */
        .dashboard-container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            display: grid;
            grid-template-columns: 360px 1fr;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CỘT TRÁI: Header & Hiển thị kết quả */
        .left-panel {
            background: var(--primary-gradient);
            padding: 36px 28px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            width: 220px;
            height: 220px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            bottom: -60px;
            right: -60px;
            pointer-events: none;
        }

        .brand-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .brand-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            margin-top: 30px;
        }

        .result-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
        }

        .result-price {
            font-size: 34px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1;
        }

        .result-unit {
            font-size: 16px;
            font-weight: 600;
            color: #FDE047;
            margin-left: 4px;
        }

        .result-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
        }

        /* CỘT PHẢI: Form nhập dữ liệu */
        .right-panel {
            padding: 36px 32px;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: #94A3B8;
            font-size: 13px;
            pointer-events: none;
            transition: color 0.2s;
        }

        input, select {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            background: #F8FAFC;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        /* Nút Submit */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.35);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -4px rgba(79, 70, 229, 0.45);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Spinner Loading */
        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive cho thiết bị di động */
        @media (max-width: 820px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                max-width: 480px;
            }
            .left-panel {
                padding: 28px 20px;
            }
            .right-panel {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- CỘT TRÁI: THÔNG TIN & KẾT QUẢ -->
    <div class="left-panel">
        <div>
            <div class="brand-tag">
                <i class="fa-solid fa-brain"></i> Machine Learning Core
            </div>
            <h1 class="brand-title">Định Giá<br>Nhà Đất AI</h1>
            <p class="brand-desc">Hệ thống phân tích giá trị bất động sản chính xác dựa trên mô hình Gradient Boosting.</p>
        </div>

        <div class="result-box">
            <div class="result-label">Giá thị trường ước tính</div>
            <div class="result-price">
                <span id="priceVal">--</span><span class="result-unit">Tỷ VNĐ</span>
            </div>
            <p class="result-sub">Dữ liệu tham chiếu theo biến động thị trường 2024</p>
        </div>
    </div>

    <!-- CỘT PHẢI: FORM NHẬP THÔNG SỐ -->
    <div class="right-panel">
        <div class="section-title">
            <i class="fa-solid fa-ruler-combined"></i> Kích thước & Lộ giới
        </div>

        <div class="grid-3">
            <div class="input-group">
                <label class="input-label">Diện tích (m²)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-chart-area input-icon"></i>
                    <input type="number" id="Area" value="75" placeholder="m²">
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Mặt tiền (m)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-arrows-left-right input-icon"></i>
                    <input type="number" id="Frontage" value="5.2" step="0.1">
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Đường vào (m)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-road input-icon"></i>
                    <input type="number" id="Access_Road" value="6.0" step="0.1">
                </div>
            </div>
        </div>

        <div class="section-title">
            <i class="fa-solid fa-house"></i> Kết cấu công trình
        </div>

        <div class="grid-3">
            <div class="input-group">
                <label class="input-label">Số tầng</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-layer-group input-icon"></i>
                    <input type="number" id="Floors" value="4">
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Phòng ngủ</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-bed input-icon"></i>
                    <input type="number" id="Bedrooms" value="4">
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Vệ sinh</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-bath input-icon"></i>
                    <input type="number" id="Bathrooms" value="4">
                </div>
            </div>
        </div>

        <div class="section-title">
            <i class="fa-solid fa-file-contract"></i> Vị trí & Pháp lý
        </div>

        <div class="input-group">
            <label class="input-label">Tỉnh / Thành phố</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-location-dot input-icon"></i>
                <input type="text" id="Province" value="Hà Nội">
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label class="input-label">Tình trạng pháp lý</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <select id="Legal_status">
                        <option value="Have certificate">Đã có sổ đỏ</option>
                        <option value="Innegotiable">Đang chờ sổ</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Nội thất</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-couch input-icon"></i>
                    <select id="Furniture_state">
                        <option value="Full">Đầy đủ nội thất</option>
                        <option value="Basic">Cơ bản</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <button class="btn-submit" id="btnPredict" onclick="handlePredict()">
            <span class="spinner" id="loadingSpinner"></span>
            <span id="btnText"><i class="fa-solid fa-wand-magic-sparkles"></i> DỰ ĐOÁN GIÁ NGAY</span>
        </button>
    </div>
</div>

<script>
    async function handlePredict() {
        const btn = document.getElementById("btnPredict");
        const btnText = document.getElementById("btnText");
        const spinner = document.getElementById("loadingSpinner");
        const priceVal = document.getElementById("priceVal");

        const payload = {
            Area: parseFloat(document.getElementById("Area").value) || 0,
            Frontage: parseFloat(document.getElementById("Frontage").value) || 0,
            Access_Road: parseFloat(document.getElementById("Access_Road").value) || 0,
            Floors: parseFloat(document.getElementById("Floors").value) || 1,
            Bedrooms: parseFloat(document.getElementById("Bedrooms").value) || 1,
            Bathrooms: parseFloat(document.getElementById("Bathrooms").value) || 1,
            Legal_status: document.getElementById("Legal_status").value,
            Furniture_state: document.getElementById("Furniture_state").value,
            Province: document.getElementById("Province").value.trim()
        };

        btn.disabled = true;
        btnText.style.display = "none";
        spinner.style.display = "inline-block";

        try {
            const res = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.status === "success") {
                animateValue(priceVal, 0, data.predicted_price, 600);
            } else {
                alert("Không thể tính toán dự đoán!");
            }
        } catch (err) {
            alert("Lỗi kết nối tới Server AI! Hãy kiểm tra Backend.");
            console.error(err);
        } finally {
            btn.disabled = false;
            btnText.style.display = "inline-block";
            spinner.style.display = "none";
        }
    }

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = (progress * (end - start) + start).toFixed(2);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }
</script>

</body>
</html>
