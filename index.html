<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Đoán Giá Nhà</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 18px; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 15px; background: #e8f0fe; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #1967d2; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2> Dự Đoán Giá Nhà</h2>
    
    <label>Diện tích (m²):</label>
    <input type="number" id="area" value="80">

    <label>Mặt tiền (m):</label>
    <input type="number" id="frontage" value="5">

    <label>Đường vào (m):</label>
    <input type="number" id="access_road" value="6">

    <label>Số tầng:</label>
    <input type="number" id="floors" value="4">

    <label>Số phòng ngủ:</label>
    <input type="number" id="bedrooms" value="3">

    <label>Số phòng tắm:</label>
    <input type="number" id="bathrooms" value="3">

    <button onclick="predict()">DỰ ĐOÁN GIÁ</button>

    <div id="result" class="result-box"></div>
</div>

<script>
async function predict() {
    const SERVER_IP = "10.206.131.96";
    const url = `http://${SERVER_IP}:5000/predict_price`;

    const payload = {
        "Area": parseFloat(document.getElementById('area').value) || 0,
        "Frontage": parseFloat(document.getElementById('frontage').value) || 0,
        "Access Road": parseFloat(document.getElementById('access_road').value) || 0,
        "Floors": parseFloat(document.getElementById('floors').value) || 0,
        "Bedrooms": parseFloat(document.getElementById('bedrooms').value) || 0,
        "Bathrooms": parseFloat(document.getElementById('bathrooms').value) || 0
    };

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const resData = await response.json();
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        if (resData.status === 'success') {
            resultDiv.innerHTML = `Giá dự đoán: ${resData.predicted_price} ${resData.unit}`;
        } else {
            resultDiv.innerHTML = `Lỗi: ${resData.message}`;
        }
    } catch (err) {
        alert("Không thể kết nối tới Server! Kiểm tra lại Wi-Fi và IP máy tính.");
    }
}
</script>

</body>
</html>
